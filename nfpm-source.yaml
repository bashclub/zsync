# Paket für die Quelle: ohne die Programme des Backupservers (Timer, Check, logrotate)
name: bashclub-zsync-source
arch: all
platform: linux
version: ${VERSION}
version_schema: none
section: admin
priority: optional
maintainer: Thorsten Spille <kontakt@spille-it.de>
description: Source side of bashclub-zsync ${VERSION} maintained from bashclub (restricted ssh access for the replication).
homepage: https://code.bashclub.org/bashclub/zsync
license: GPL-3.0-or-later

depends:
  - openssh-server
  - sudo
  - zfsutils-linux | openzfs-zfsutils

# Snapshot-Engine zas (zfs_auto_snapshot_engine=zas) läuft auf der Quelle
recommends:
  - zfs-auto-snapshot

contents:
  # forced command (command= in authorized_keys) for the user of the backup server
  - src: bashclub-zsync-source/usr/bin/bashclub-zsync-remote
    dst: /usr/bin/bashclub-zsync-remote
    file_info: { mode: 0755 }

  # users of the replication jobs, run by root or by the management user zsync with sudo
  - src: bashclub-zsync-source/usr/sbin/bashclub-zsync-job-user
    dst: /usr/sbin/bashclub-zsync-job-user
    file_info: { mode: 0755 }
  - src: bashclub-zsync-source/etc/sudoers.d/bashclub-zsync-source
    dst: /etc/sudoers.d/bashclub-zsync-source
    type: config|noreplace
    file_info: { mode: 0440 }

  # copyright (DEP-5): GPL-3.0-or-later since 2.0.0, MIT notice of the versions up to 1.0.19
  - src: packaging/copyright
    dst: /usr/share/doc/bashclub-zsync-source/copyright
    file_info: { mode: 0644 }

scripts:
  preinstall: packaging/scripts/source-preinst
  postinstall: packaging/scripts/source-postinst
