# run status of bashclub-zsync for the monitoring: one folder per user, the users of the group bashclub-zsync create
# their own (operation without root), sticky bit: no one changes the folder of another user
d /run/bashclub-zsync 1775 root bashclub-zsync -
d /run/bashclub-zsync/root 0755 root root -
