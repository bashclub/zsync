# Paket bashclub-zsync-restore (Restore-Toolbox), eigener Lauf: bauen, testen, veröffentlichen wie bashclub-zsync
name: bashclub-zsync-restore
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    uses: bashclub/ci-tools/.forgejo/workflows/package.yml@v1
    with:
      nfpm-config: nfpm-restore.yaml
      # lesender Befehl unter --root läuft, Befehle außerhalb und schreibende werden abgewiesen (Exit 126)
      smoke-test: |
        SSH_ORIGINAL_COMMAND=root bashclub-zsync-restore-remote --root pool/backup
        rc=0; SSH_ORIGINAL_COMMAND='zfs list -H pool/other' bashclub-zsync-restore-remote --root pool/backup || rc=$?
        test $rc -eq 126
        rc=0; SSH_ORIGINAL_COMMAND='zfs destroy pool/backup/x@s' bashclub-zsync-restore-remote --root pool/backup || rc=$?
        test $rc -eq 126
        test -d /var/lib/bashclub-zsync-restore-users
        out=$(bashclub-zsync-restore 2>&1 || true)
        grep -q 'access pull' <<< "$out"
      test-targets: '["debian-12","debian-13","ubuntu-24.04","ubuntu-26.04"]'
      deb-dists: "bookworm trixie noble resolute"
      formats: deb
      upgrade-test: true
      test-prepare: |
        set -euo pipefail
        echo 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99no-recommends
        # contrib (zfsutils-linux) für Debian-Quellen ergänzen, falls nicht vorhanden
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
          [ -f "$f" ] || continue
          sed -Ei '/^[[:space:]]*deb(-src)?[[:space:]].*debian\.org/{/[[:space:]]contrib([[:space:]]|$)/!s/[[:space:]]*$/ contrib/}' "$f"
        done
        for f in /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue
          awk 'BEGIN { RS = ""; ORS = "\n\n" }
               /URIs:[^\n]*debian\.org/ && !/Components:[^\n]*[ \t]contrib([ \t\n]|$)/ { sub(/Components:[^\n]*/, "& contrib") }
               { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
        done
        apt-get update -qq
    secrets: inherit
