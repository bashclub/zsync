# Paket bashclub-zsync-source (Quelle), eigener Lauf: bauen, testen, veröffentlichen wie bashclub-zsync
name: bashclub-zsync-source
# nur bei Änderungen an diesem Paket (die Integrationstests im Lauf von bashclub-zsync bauen bei jeder Änderung alle
# Pakete); Tags und manueller Start bauen es immer
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "bashclub-zsync-source/**"
      - "nfpm-source.yaml"
      - "packaging/copyright"
      - "packaging/scripts/source-*"
      - ".forgejo/workflows/package-source.yml"
  pull_request:
    paths:
      - "bashclub-zsync-source/**"
      - "nfpm-source.yaml"
      - "packaging/copyright"
      - "packaging/scripts/source-*"
      - ".forgejo/workflows/package-source.yml"
  workflow_dispatch:

jobs:
  package:
    uses: bashclub/ci-tools/.forgejo/workflows/package.yml@v1
    with:
      nfpm-config: nfpm-source.yaml
      # erlaubter Befehl läuft, eine Shell wird abgewiesen (Exit 126)
      smoke-test: |
        SSH_ORIGINAL_COMMAND=exit bashclub-zsync-remote
        rc=0; SSH_ORIGINAL_COMMAND=id bashclub-zsync-remote || rc=$?
        test $rc -eq 126
        # Verwaltungsbenutzer darf per sudo nur bashclub-zsync-job-user
        id zsync
        visudo -cf /etc/sudoers.d/bashclub-zsync-source
        sudo -l -U zsync | grep -q '(root) NOPASSWD: /usr/sbin/bashclub-zsync-job-user'
      test-targets: '["debian-12","debian-13","ubuntu-24.04","ubuntu-26.04"]'
      deb-dists: "bookworm trixie noble resolute"
      formats: deb
      upgrade-test: true
      test-prepare: |
        set -euo pipefail
        echo 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99no-recommends
        # contrib (zfsutils-linux) für Debian-Quellen ergänzen, falls nicht vorhanden
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
          [ -f "$f" ] || continue
          sed -Ei '/^[[:space:]]*deb(-src)?[[:space:]].*debian\.org/{/[[:space:]]contrib([[:space:]]|$)/!s/[[:space:]]*$/ contrib/}' "$f"
        done
        for f in /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue
          awk 'BEGIN { RS = ""; ORS = "\n\n" }
               /URIs:[^\n]*debian\.org/ && !/Components:[^\n]*[ \t]contrib([ \t\n]|$)/ { sub(/Components:[^\n]*/, "& contrib") }
               { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
        done
        apt-get update -qq
    secrets: inherit
