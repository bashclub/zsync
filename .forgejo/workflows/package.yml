on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  package:
    uses: bashclub/ci-tools/.forgejo/workflows/package.yml@v1
    with:
      smoke-test: bashclub-zsync -h
      # TODO: RPM-Targets ergänzen, sobald zfs/bashclub-checkzfs/zfs-auto-snapshot
      # dort installierbar sind (siehe overrides.rpm in nfpm.yaml)
      test-targets: '["debian-12","debian-13"]'
      # TODO: RPM erst veröffentlichen, wenn die Abhängigkeiten geklärt sind
      rpm-targets: ""
      test-prepare: |
        set -euo pipefail
        echo 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99no-recommends
        # contrib (zfsutils-linux, zfs-auto-snapshot) für Debian-Quellen ergänzen, falls nicht vorhanden
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
          [ -f "$f" ] || continue
          sed -Ei '/^[[:space:]]*deb(-src)?[[:space:]].*debian\.org/{/[[:space:]]contrib([[:space:]]|$)/!s/[[:space:]]*$/ contrib/}' "$f"
        done
        for f in /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue
          awk 'BEGIN { RS = ""; ORS = "\n\n" }
               /URIs:[^\n]*debian\.org/ && !/Components:[^\n]*[ \t]contrib([ \t\n]|$)/ { sub(/Components:[^\n]*/, "& contrib") }
               { print }' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
        done
        apt-get update -qq && apt-get install -y -qq ca-certificates curl gpg
        curl -fsSL https://apt.bashclub.org/gpg/bashclub.pub | gpg --dearmor > /usr/share/keyrings/bashclub-archive-keyring.gpg
        . /etc/os-release
        if [ "${VERSION_ID%%.*}" -ge 13 ]; then
          printf '%s\n' 'Types: deb' 'URIs: https://apt.bashclub.org/release' "Suites: $VERSION_CODENAME" \
            'Components: main' 'Signed-By: /usr/share/keyrings/bashclub-archive-keyring.gpg' > /etc/apt/sources.list.d/bashclub.sources
        else
          echo "deb [signed-by=/usr/share/keyrings/bashclub-archive-keyring.gpg] https://apt.bashclub.org/release $VERSION_CODENAME main" > /etc/apt/sources.list.d/bashclub.list
        fi
        apt-get update -qq
    secrets: inherit

  # Release-Automatik: Quelle der Version ist __version__ in bashclub-zsync.
  # Wird sie erhöht (mit Eintrag in CHANGELOG.md), taggt ein Push auf main
  # automatisch v<version>; der Tag-Push baut und veröffentlicht das Release.
  release-tag:
    needs: package
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: debian-13
    steps:
      - uses: https://code.bashclub.org/bashclub/ci-tools/setup-distro@v1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag-Pushes mit dem automatischen Token lösen keine Workflows aus
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Version prüfen und taggen
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          ver=$(sed -nE 's/^__version__=v?([0-9][^[:space:]]*)$/\1/p' bashclub-zsync/usr/bin/bashclub-zsync)
          [ -n "$ver" ] || { echo "__version__ in bashclub-zsync nicht gefunden"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null || git rev-parse -q --verify "refs/tags/$ver" >/dev/null; then
            echo "Version $ver ist bereits getaggt – kein neues Release"
            exit 0
          fi
          grep -qF "## [v$ver]" CHANGELOG.md || { echo "CHANGELOG.md hat keinen Eintrag '## [v$ver]'"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" != push ] || [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "Neue Version $ver erkannt – wird beim Merge nach main als v$ver getaggt"
            exit 0
          fi
          [ -n "${RELEASE_TOKEN:-}" ] || { echo "Secret RELEASE_TOKEN fehlt"; exit 1; }
          git tag "v$ver"
          git push origin "v$ver"
          echo "v$ver getaggt – Release-Build startet über den Tag"
