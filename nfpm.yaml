name: bashclub-zsync
arch: all
platform: linux
version: ${VERSION}
version_schema: none
section: admin
priority: optional
maintainer: Thorsten Spille <kontakt@spille-it.de>
description: The deb package for bashclub-zsync ${VERSION} maintained from bashclub.
homepage: https://code.bashclub.org/bashclub/zsync

depends:
  - bashclub-checkzfs
  - openssh-server
  - udisks2
  - zfs-auto-snapshot
  - zfsutils-linux

overrides:
  rpm:
    depends:
      - openssh-server
      - udisks2
      # TODO: "zfs" kommt nicht aus den Distro-Repos, sondern aus dem
      # OpenZFS-Repo (EL/Fedora) bzw. OBS filesystems (SUSE).
      - zfs
      # TODO: bashclub-checkzfs als RPM auf rpm.bashclub.org verfügbar?
      # - bashclub-checkzfs
      # TODO: zfs-auto-snapshot gibt es für EL/Fedora/SUSE nicht als Paket;
      # bashclub-zsync kann alternativ zfs_auto_snapshot_engine=internal nutzen.
      # - zfs-auto-snapshot

contents:
  - src: bashclub-zsync/usr/bin/bashclub-zsync
    dst: /usr/bin/bashclub-zsync
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/bin/remote-snapshot-manager
    dst: /usr/bin/remote-snapshot-manager
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/bin/zsync-autorun
    dst: /usr/bin/zsync-autorun
    file_info: { mode: 0755 }

  - src: bashclub-zsync/etc/bashclub/zsync.conf.example
    dst: /etc/bashclub/zsync.conf.example
    type: config|noreplace
    file_info: { mode: 0644 }
  - src: bashclub-zsync/etc/logrotate.d/bashclub-zsync
    dst: /etc/logrotate.d/bashclub-zsync
    type: config|noreplace
    file_info: { mode: 0644 }
  # deb: bisheriger Pfad beibehalten; rpm: Paket-Unit-Verzeichnis
  - src: bashclub-zsync/etc/systemd/system/zsync-autorun@.service
    dst: /etc/systemd/system/zsync-autorun@.service
    packager: deb
    file_info: { mode: 0644 }
  - src: bashclub-zsync/etc/systemd/system/zsync-autorun@.service
    dst: /usr/lib/systemd/system/zsync-autorun@.service
    packager: rpm
    file_info: { mode: 0644 }
  - src: bashclub-zsync/etc/udev/rules.d/90-automount-zsync.rules.example
    dst: /etc/udev/rules.d/90-automount-zsync.rules.example
    file_info: { mode: 0644 }

  - src: LICENSE
    dst: /usr/share/doc/bashclub-zsync/copyright/LICENSE
    packager: deb
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/licenses/bashclub-zsync/LICENSE
    packager: rpm
    type: license
    file_info: { mode: 0644 }
  - src: CHANGELOG.md
    dst: /usr/share/doc/bashclub-zsync/CHANGELOG.md
    file_info: { mode: 0644 }

scripts:
  preinstall: packaging/scripts/preinst
  postinstall: packaging/scripts/postinst
  postremove: packaging/scripts/postrm
