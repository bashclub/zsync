name: bashclub-zsync
arch: all
platform: linux
version: ${VERSION}
version_schema: none
section: admin
priority: optional
maintainer: Thorsten Spille <kontakt@spille-it.de>
description: The deb package for bashclub-zsync ${VERSION} maintained from bashclub.
homepage: https://code.bashclub.org/bashclub/zsync
license: GPL-3.0-or-later

depends:
  - openssh-server
  - udisks2
  - zfsutils-linux | openzfs-zfsutils

# bashclub-zsync-restore: Restore-Toolbox (Pull-Benutzer, Push, Wiederherstellung)
# zfs-auto-snapshot: Snapshot-Engine zas, auf dem Backupserver nur im lokalen Modus nötig (sonst auf der Quelle);
# cryptsetup, mailx: nur für zsync-autorun (Wechseldatenträger mit LUKS, Mailbenachrichtigung)
# bashclub-checkzfs: monitor_engine=checkzfs; ab 2.0 prüft zsync die Snapshots auch selbst (monitor_engine=internal)
recommends:
  - bashclub-checkzfs
  - bashclub-zsync-restore
  - zfs-auto-snapshot
  - cryptsetup
  - bsd-mailx | mailx

# nur für bandwidth_limit
suggests:
  - pv

contents:
  - src: bashclub-zsync/usr/bin/bashclub-zsync
    dst: /usr/bin/bashclub-zsync
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/bin/remote-snapshot-manager
    dst: /usr/bin/remote-snapshot-manager
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/bin/bashclub-zsync-timer
    dst: /usr/bin/bashclub-zsync-timer
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/bin/bashclub-zsync-maintenance
    dst: /usr/bin/bashclub-zsync-maintenance
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/bin/bashclub-zsync-disk
    dst: /usr/bin/bashclub-zsync-disk
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/bin/bashclub-zsync-setup
    dst: /usr/bin/bashclub-zsync-setup
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/lib/bashclub-zsync/schedule.sh
    dst: /usr/lib/bashclub-zsync/schedule.sh
    file_info: { mode: 0644 }
  # timers from the configurations with trigger=systemd (at boot and with daemon-reload)
  - src: bashclub-zsync/usr/lib/systemd/system-generators/bashclub-zsync-generator
    dst: /usr/lib/systemd/system-generators/bashclub-zsync-generator
    file_info: { mode: 0755 }
  - src: bashclub-zsync/usr/lib/systemd/system/bashclub-zsync@.service
    dst: /usr/lib/systemd/system/bashclub-zsync@.service
    file_info: { mode: 0644 }
  - src: bashclub-zsync/usr/lib/systemd/system/bashclub-zsync@.timer
    dst: /usr/lib/systemd/system/bashclub-zsync@.timer
    file_info: { mode: 0644 }
  - src: bashclub-zsync/usr/bin/zsync-autorun
    dst: /usr/bin/zsync-autorun
    file_info: { mode: 0755 }

  # Checkmk-Check: bashclub-zsync schreibt seine Ausgabe als Spool-Datei (Lauf, Watchdog, -s)
  - src: bashclub-zsync/usr/share/bashclub-zsync/checkmk/bashclub_zsync
    dst: /usr/share/bashclub-zsync/checkmk/bashclub_zsync
    file_info: { mode: 0755 }

  - src: bashclub-zsync/etc/bashclub/zsync.conf.example
    dst: /etc/bashclub/zsync.conf.example
    file_info: { mode: 0644 }
  - src: bashclub-zsync/etc/logrotate.d/bashclub-zsync
    dst: /etc/logrotate.d/bashclub-zsync
    type: config|noreplace
    file_info: { mode: 0644 }
  - src: bashclub-zsync/usr/lib/tmpfiles.d/bashclub-zsync.conf
    dst: /usr/lib/tmpfiles.d/bashclub-zsync.conf
    file_info: { mode: 0644 }
  - src: bashclub-zsync/etc/systemd/system/zsync-autorun@.service
    dst: /etc/systemd/system/zsync-autorun@.service
    file_info: { mode: 0644 }
  - src: bashclub-zsync/etc/udev/rules.d/90-automount-zsync.rules.example
    dst: /etc/udev/rules.d/90-automount-zsync.rules.example
    file_info: { mode: 0644 }

  # copyright (DEP-5): GPL-3.0-or-later since 2.0.0, MIT notice of the versions up to 1.0.19
  - src: packaging/copyright
    dst: /usr/share/doc/bashclub-zsync/copyright
    file_info: { mode: 0644 }
  - src: CHANGELOG.md
    dst: /usr/share/doc/bashclub-zsync/CHANGELOG.md
    file_info: { mode: 0644 }

scripts:
  preinstall: packaging/scripts/preinst
  postinstall: packaging/scripts/postinst
  postremove: packaging/scripts/postrm
